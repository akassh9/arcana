<script>
'use strict';
// ============================================================
// ARCANA — a launch film. Every frame drawn on Canvas 2D.
// ============================================================

// ===================== BRIEF & BEAT SHEET =====================
// Subject: everyone carries a question to some quiet place; the deck answers one, and the day sky answers them all.
// Format: 1:1, short side 1080, drawn 12 fps, output 24 fps, 21.3 s.
// Look: riso (the places: first light in cornflower, lilac, rose and apricot dots on pearl stock)
//       cut against ink (the deck: the app's own cards, pen line on cotton stock, one gold).
// Anchor: one gold light at the centre of the frame — each place's lamp or window, the hub of the
//         wheel, the gold of every card in the riffle, the back's sun, which rises into the Star's
//         heart; last, the light that passes across the name.
// (beat sheet: see TIMELINE below)

// ===================== PALETTES =====================
// Riso inks chosen so that, at the coverage the plates use, they print the app's sky:
// skyBlue #ccdbf5, lilac #e0d8f7, rose #fdddcc, dawn #ffe0b0 on pearl.
const FIRST_LIGHT = makePalette({
  paper: '#f6f1e7', paperBand: null, ink: '#2a2230', night: '#3b3357', chalk: '#f6f1e7', chalkDim: '#a79fc4',
  guide: 'rgba(120,100,190,.45)',
  fills: ['#7d9fe0', '#a896e2', '#ee9f98', '#f3b95e', '#c9a82f', '#8c7bc8'],
  shade: '#5b4f8a', light: '#fdfaf2', blush: '#ee9f98',
  accents: ['#c9a82f', '#9d8ae0', '#ec8f8a', '#6f96e0'],
  inks: ['#6f97e0', '#9f8be0', '#ef9690', '#f4b454'],
  gold: '#c9a82f', goldLit: '#ecce6e', goldDeep: '#8a6819', blood: '#8c2e25',
  finish: 'riso',
}, 'risoPop');
// The deck: the app's Palette.swift — cotton stock, ink, gold leaf, oxblood.
const CARD_STOCK = makePalette({
  paper: '#f3ede0', paperBand: null, ink: '#15110e', night: '#3b3357', chalk: '#f3ede0', chalkDim: '#b3a98f',
  guide: 'rgba(140,46,37,.35)',
  fills: ['#c9a82f', '#ecce6e', '#8a6819', '#f3ede0'], shade: '#4d3a1f', light: '#fbf6ea', blush: '#8c2e25',
  accents: ['#c9a82f', '#8c2e25', '#ecce6e', '#8a6819'],
  inks: ['#15110e', '#c9a82f'],
  gold: '#c9a82f', goldLit: '#ecce6e', goldDeep: '#8a6819', blood: '#8c2e25', sky: '#dfe3f2',
  finish: 'ink',
}, 'paperInk');
usePalette(FIRST_LIGHT);

// ===================== THE PEN (ported from the app's Ink.swift) =====================
// The same seeded generator and the same bowed strokes, so each card is drawn
// stroke for stroke as it is in the app. Marks are flattened to polylines so a
// stroke can be laid down part way, the way the app writes a card.
function seedHash(str) { let h = 2166136261 >>> 0; for (const b of new TextEncoder().encode(str)) { h = (h ^ b) >>> 0; h = Math.imul(h, 16777619) >>> 0; } return h; }
class AppRng {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() { this.s = (this.s + 0x6D2B79F5) >>> 0; let t = this.s; t = Math.imul(t ^ (t >>> 15), t | 1) >>> 0; t = (t ^ ((t + (Math.imul(t ^ (t >>> 7), t | 61) >>> 0)) >>> 0)) >>> 0; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  sym(a) { return (this.next() * 2 - 1) * a; }
}
// a path is a list of subpaths; each subpath is a list of [x, y] after flattening
const CUBIC_STEPS = 14;
function cubicPts(out, p0, c1, c2, p3) { for (let k = 1; k <= CUBIC_STEPS; k++) out.push(bez(p0, c1, c2, p3, k / CUBIC_STEPS)); }
function smoothPts(pts, closed) {
  const n = pts.length; if (n <= 2) return pts.slice();
  const out = [pts[0]], last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = pts[closed ? (i - 1 + n) % n : Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[closed ? (i + 1) % n : Math.min(i + 1, n - 1)], p3 = pts[closed ? (i + 2) % n : Math.min(i + 2, n - 1)];
    cubicPts(out, p1, [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6], p2);
  }
  return out;
}
class Pen {
  constructor(seed) { this.r = new AppRng(seed); this.marks = []; }
  bowed(x1, y1, x2, y2, amp) {
    const r = this.r, dx = x2 - x1, dy = y2 - y1, len = Math.max(Math.hypot(dx, dy), 1e-4), nx = -dy / len, ny = dx / len;
    const o1 = r.sym(amp), o2 = r.sym(amp);
    const a = [x1 + r.sym(amp * .4), y1 + r.sym(amp * .4)], b = [x2 + r.sym(amp * .4), y2 + r.sym(amp * .4)];
    const out = [a]; cubicPts(out, a, [x1 + dx * .33 + nx * o1, y1 + dy * .33 + ny * o1], [x1 + dx * .66 + nx * o2, y1 + dy * .66 + ny * o2], b); return out;
  }
  add(pts, closed, stroke, width, fill) { this.marks.push({ pts, closed, stroke, width, fill }); }
  line(x1, y1, x2, y2, w = 1.5, c = 'ink', amp = 1.1) { this.add(this.bowed(x1, y1, x2, y2, amp), false, c, w, null); }
  ringPoints(cx, cy, rad, amp = 1.3, segs = 22, squash = 1) { const out = []; for (let i = 0; i < segs; i++) { const a = i / segs * TAU, rr = rad + this.r.sym(amp); out.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * squash]); } return out; }
  ring(cx, cy, rad, w = 1.5, c = 'ink', amp = 1.3, segs = 22, squash = 1) { this.add(smoothPts(this.ringPoints(cx, cy, rad, amp, segs, squash), true), true, c, w, null); }
  dot(cx, cy, rad, c = 'gold') { this.add(smoothPts(this.ringPoints(cx, cy, rad, .25, 14), true), true, c === 'gold' ? 'ink' : null, .8, c); }
  sharp(pts, amp, closed) {
    const r = this.r, v = pts.map(q => [q[0] + r.sym(amp), q[1] + r.sym(amp)]); if (!v.length) return [];
    const out = [v[0]], last = closed ? v.length : v.length - 1;
    for (let i = 0; i < last; i++) { const a = v[i], b = v[(i + 1) % v.length], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.max(Math.hypot(dx, dy), 1e-4), nx = -dy / len, ny = dx / len; const o1 = r.sym(amp * .7), o2 = r.sym(amp * .7); cubicPts(out, a, [a[0] + dx * .33 + nx * o1, a[1] + dy * .33 + ny * o1], [a[0] + dx * .66 + nx * o2, a[1] + dy * .66 + ny * o2], b); }
    return out;
  }
  poly(pts, w = 1.5, c = 'ink', amp = 1.1, closed = true) { this.add(this.sharp(pts, amp, closed), closed, c, w, null); }
  fillPoly(pts, c = 'gold', amp = .8) { this.add(this.sharp(pts, amp, true), true, c === 'gold' ? 'ink' : null, .8, c); }
  smooth(pts, closed = true, w = 1.5, c = 'ink') { this.add(smoothPts(pts, closed), closed, c, w, null); }
  fillSmooth(pts, c = 'gold', outline = true) { this.add(smoothPts(pts, true), true, outline && c === 'gold' ? 'ink' : null, .8, c); }
  fillChord(pts, c) { this.add(smoothPts(pts, false), true, c === 'gold' ? 'ink' : null, .8, c); }
  fillSmoothPts(pts, c, outline = false) { this.add(smoothPts(pts, true), true, outline ? 'ink' : null, .8, c); }
  diamondPts(cx, cy, rx, ry) { return [[cx, cy - ry], [cx + rx, cy], [cx, cy + ry], [cx - rx, cy]]; }
  diamond(cx, cy, rx, ry, w = 1.1, c = 'accent', amp = 1) { this.poly(this.diamondPts(cx, cy, rx, ry ?? rx), w, c, amp); }
  fillDiamond(cx, cy, rx, ry, c = 'accent') { this.fillPoly(this.diamondPts(cx, cy, rx, ry ?? rx), c, .6); }
  rays(cx, cy, r0, r1, n, w = 1.5, offset = 0, c = 'ink') { for (let i = 0; i < n; i++) { const a = offset + i / n * TAU, wb = 1 + this.r.sym(.04); this.line(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * r1 * wb, cy + Math.sin(a) * r1 * wb, w, c, .9); } }
  hatch(x, y, wd, ht, gap = 5, angle = -.6, w = .75) {
    const span = (Math.abs(wd) + Math.abs(ht)) * 1.4, dx = Math.cos(angle), dy = Math.sin(angle), cx = x + wd / 2, cy = y + ht / 2, count = Math.ceil(span / gap);
    for (let i = Math.trunc(-count / 2); i < Math.trunc(count / 2); i++) {
      const ox = cx - dy * i * gap, oy = cy + dx * i * gap; let t0 = -span, t1 = span, dead = false;
      const clip = (pos, d, lo, hi) => { if (Math.abs(d) < 1e-6) { if (pos < lo || pos > hi) dead = true; return; } let a = (lo - pos) / d, b = (hi - pos) / d; if (a > b) [a, b] = [b, a]; t0 = Math.max(t0, a); t1 = Math.min(t1, b); };
      clip(ox, dx, x, x + wd); clip(oy, dy, y, y + ht); if (dead || t1 - t0 < 2) continue;
      const j = this.r.sym(1.2); this.line(ox + dx * (t0 + 1), oy + dy * (t0 + 1), ox + dx * (t1 - 1) + j, oy + dy * (t1 - 1), w, 'ink', .5);
    }
  }
  ticks(cx, cy, rad, len, n, w = .8) { for (let i = 0; i < n; i++) { const a = i / n * TAU; this.line(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, cx + Math.cos(a) * (rad + len), cy + Math.sin(a) * (rad + len), w, 'ink', .4); } }
  ripples(width, y0, count = 4, gap = 9) { for (let i = 0; i < count; i++) { const y = y0 + i * gap, inset = 14 + i * 5, pts = []; for (let k = 0; k <= 8; k++) pts.push([inset + (width - inset * 2) * k / 8, y + Math.sin(k * 1.6 + i) * 1.8 + this.r.sym(.8)]); this.smooth(pts, false, 1.1); } }
  eye(cx, cy, rx, ry) { this.fillPoly([[cx - rx, cy], [cx - rx * .45, cy - ry], [cx + rx * .45, cy - ry], [cx + rx, cy], [cx + rx * .45, cy + ry], [cx - rx * .45, cy + ry]], 'gold', .8); this.dot(cx, cy, ry * .52, 'ink'); }
}

// ===================== THE TWENTY-TWO (ported from CardArt.swift) =====================
// Art space 186 x 248; the card 226 x 400, art centred at (113, 176).
const ART_W = 186, ART_H = 248, CARD_W = 226, CARD_H = 400;
const MAJORS = [
  ['fool', 'O', 'The Fool', 'Leap Without Ledger'], ['magician', 'I', 'The Magician', 'As Above, So Below'],
  ['priestess', 'II', 'The High Priestess', 'The Sealed Door'], ['empress', 'III', 'The Empress', 'Abundant Ground'],
  ['emperor', 'IV', 'The Emperor', 'The Iron Seat'], ['hierophant', 'V', 'The Hierophant', 'The Old Order'],
  ['lovers', 'VI', 'The Lovers', 'Two Made One'], ['chariot', 'VII', 'The Chariot', 'Reins and Road'],
  ['strength', 'VIII', 'Strength', 'The Gentle Hand'], ['hermit', 'IX', 'The Hermit', 'One Lamp, One Path'],
  ['wheel', 'X', 'Wheel of Fortune', 'The Turning Rim'], ['justice', 'XI', 'Justice', 'The Level Scale'],
  ['hanged', 'XII', 'The Hanged Man', 'Inverted Sight'], ['death', 'XIII', 'Death', 'The Clean Break'],
  ['temperance', 'XIV', 'Temperance', 'The Measured Pour'], ['devil', 'XV', 'The Devil', 'The Willing Chain'],
  ['tower', 'XVI', 'The Tower', 'The Sudden Bolt'], ['star', 'XVII', 'The Star', 'Water Under Starlight'],
  ['moon', 'XVIII', 'The Moon', 'The Long Tide'], ['sun', 'XIX', 'The Sun', 'Unshaded Noon'],
  ['judgement', 'XX', 'Judgement', 'The Sounding Call'], ['world', 'XXI', 'The World', 'The Closed Circle'],
].map(([id, roman, name, essence]) => ({ id, roman, name, essence }));
const ART = (() => {
  const Wd = ART_W, X = ART_W / 2, Y = ART_H / 2;
  return {
    fool(p) { for (let i = 0; i < 5; i++) { const x = 18 + i * 16, y = 92 + i * 22; p.line(x, y, x + 16, y, 1.6); p.line(x + 16, y, x + 16, y + 22, 1.6); }
      p.hatch(18, 114, 80, 112, 6, -1.0, .6); p.ring(126, 74, 30, 1.5, 'ink', 1.4, 24); p.rays(126, 74, 34, 46, 12, .9); p.dot(126, 74, 12); p.diamond(126, 74, 19, undefined, 1); p.line(100, 196, 168, 150, 1.4); p.fillDiamond(168, 150, 5); },
    magician(p) { p.rays(X, Y, 6, 108, 18, 1.6); p.ring(X, Y, 46, 1.6, 'ink', 1.6, 26); p.diamond(X, Y, 52, undefined, 1.1); p.eye(X, Y, 25, 11); },
    priestess(p) { for (const x of [38, Wd - 38]) { p.line(x, 46, x, 208, 2.6); p.poly([[x - 12, 38], [x + 12, 38], [x + 12, 48], [x - 12, 48]], 1.5, 'ink', .8); p.poly([[x - 14, 206], [x + 14, 206], [x + 14, 216], [x - 14, 216]], 1.5, 'ink', .8); }
      p.poly([[48, 56], [Wd - 48, 56], [Wd - 48, 204], [48, 204]], 1.4, 'ink', 1); p.hatch(50, 58, Wd - 100, 144, 5, 1.45, .7); p.line(48, 56, Wd - 48, 56, 1.8);
      for (const d of [[X, 84], [X - 20, 106], [X + 20, 106], [X, 128]]) p.diamond(d[0], d[1], 6, 8, 1);
      p.fillDiamond(X, 106, 9, 12, 'gold'); const c = p.ringPoints(X, 176, 19, .5, 18); p.fillSmoothPts(c, 'gold', true); p.fillSmoothPts(c.map(q => [q[0] + 13, q[1]]), 'paper'); },
    empress(p) { for (let i = 0; i < 6; i++) { const y = 150 + i * 14, pts = []; for (let k = 0; k <= 8; k++) { const t = k / 8; pts.push([10 + t * (Wd - 20), y - Math.cos(t * Math.PI) * (7 - i)]); } p.smooth(pts, false, 1.2); }
      p.dot(X, 104, 20); p.ring(X, 104, 30, 1.5, 'ink', 1.5, 24); p.rays(X, 104, 32, 42, 8, 1.2, Math.PI / 8);
      for (const dir of [-1, 1]) { p.smooth([[X, 104], [X + dir * 22, 84], [X + dir * 34, 52]], false, 1.5); p.smooth([[X + dir * 32, 54], [X + dir * 44, 38], [X + dir * 50, 50], [X + dir * 38, 60]], true, 1.2); }
      p.fillDiamond(X, 52, 7); },
    emperor(p) { p.poly([[28, 40], [Wd - 28, 40], [Wd - 28, 208], [28, 208]], 2, 'ink', 1.4); p.poly([[42, 54], [Wd - 42, 54], [Wd - 42, 194], [42, 194]], 1.2, 'ink', 1.2); p.line(X, 54, X, 194, 1.5); p.line(42, 124, Wd - 42, 124, 1.5);
      p.fillPoly([[X - 18, 96], [X + 18, 96], [X + 18, 152], [X - 18, 152]], 'gold', .9); p.diamond(X, 124, 11, undefined, 1.1); p.hatch(44, 56, 42, 42, 5, -.7, .6); p.hatch(Wd - 86, 150, 42, 42, 5, -.7, .6); p.rays(X, 124, 78, 92, 4, 1.6, Math.PI / 4); },
    hierophant(p) { for (const [y, rad] of [[44, 52], [62, 38], [80, 24]]) { const pts = []; for (let k = 0; k <= 10; k++) { const a = Math.PI + k / 10 * Math.PI; pts.push([X + Math.cos(a) * rad, y + Math.sin(a) * rad * .62]); } p.smooth(pts, false, 1.6); }
      p.line(X - 52, 44, X - 52, 200, 1.8); p.line(X + 52, 44, X + 52, 200, 1.8); p.line(X - 62, 200, X + 62, 200, 1.8);
      for (const dir of [-1, 1]) { p.line(X, 120, X + dir * 34, 186, 1.6); p.ring(X + dir * 34, 186, 8, 1.4, 'ink', .6, 14); p.line(X + dir * 12, 150, X + dir * 22, 146, 1.2); }
      p.fillDiamond(X, 108, 15, 19, 'gold'); p.diamond(X, 108, 22, 27, 1); },
    lovers(p) { p.ring(X - 26, Y + 8, 48, 1.7, 'ink', 1.5, 26); p.ring(X + 26, Y + 8, 48, 1.7, 'ink', 1.5, 26); p.fillPoly([[X, Y - 32], [X + 16, Y + 8], [X, Y + 48], [X - 16, Y + 8]], 'gold', .9);
      p.rays(X, 34, 22, 40, 7, 1.2, Math.PI * .12); p.diamond(X, 34, 12, undefined, 1.2); p.line(14, Y + 66, Wd - 14, Y + 66, 1.3); p.hatch(14, Y + 68, Wd - 28, 24, 5, -.9, .6); },
    chariot(p) { p.ring(X, Y - 6, 54, 2, 'ink', 1.6, 28); p.ring(X, Y - 6, 44, 1, 'ink', 1.2, 24); p.rays(X, Y - 6, 10, 44, 10, 1.4); p.dot(X, Y - 6, 11); p.diamond(X, Y - 6, 16, undefined, 1);
      for (let i = 0; i < 3; i++) { const y = Y + 66 + i * 12; p.smooth([[26, y - 7], [X, y + 5], [Wd - 26, y - 7]], false, 1.5 - i * .25); }
      p.line(24, 42, 60, 42, 1.4); p.line(Wd - 60, 42, Wd - 24, 42, 1.4); p.ticks(X, Y - 6, 58, 6, 20); },
    strength(p) { for (const dir of [-1, 1]) { const pts = []; for (let i = 0; i < 18; i++) { const a = i / 18 * TAU; pts.push([X + dir * 30 + Math.cos(a) * 30, Y + Math.sin(a) * 26 + p.r.sym(1.1)]); } p.smooth(pts, true, 2); }
      p.dot(X, Y, 8); p.rays(X, Y, 66, 86, 16, .9); p.ring(X, Y, 64, 1.2, 'ink', 1.6, 26); p.fillDiamond(X, Y - 92, 8); p.fillDiamond(X, Y + 92, 8); },
    hermit(p) { p.line(X + 44, 34, X + 44, 214, 2.4); p.poly([[X - 34, 72], [X + 8, 72], [X + 16, 96], [X + 16, 132], [X - 42, 132], [X - 42, 96]], 1.8, 'ink', 1.2); p.line(X - 42, 96, X + 16, 96, 1.2);
      p.fillPoly([[X - 13, 104], [X - 4, 118], [X - 13, 128], [X - 22, 118]], 'gold', .7); p.line(X - 13, 60, X - 13, 72, 1.4); p.rays(X - 13, 116, 30, 46, 9, .9, Math.PI * .08);
      p.line(10, 190, Wd - 10, 190, 1.5); p.hatch(10, 192, Wd - 20, 34, 6, -1.1, .7); p.fillDiamond(X + 44, 34, 7); },
    wheel(p) { p.ring(X, Y, 74, 2, 'ink', 1.8, 32); p.ring(X, Y, 62, 1, 'ink', 1.4, 28); p.ring(X, Y, 26, 1.5, 'ink', 1.2, 20); p.rays(X, Y, 26, 62, 8, 1.6, Math.PI / 8); p.ticks(X, Y, 76, 7, 32); p.dot(X, Y, 13);
      for (let i = 0; i < 4; i++) { const a = i / 4 * TAU; p.fillDiamond(X + Math.cos(a) * 88, Y + Math.sin(a) * 100, 8); }
      p.poly([[X, Y - 44], [X + 44, Y], [X, Y + 44], [X - 44, Y]], 1, 'ink', 1.2); },
    justice(p) { p.line(X, 44, X, 206, 2.2); p.line(X - 66, 84, X + 66, 84, 2);
      for (const dir of [-1, 1]) { p.line(X + dir * 66, 84, X + dir * 66, 118, 1.2); p.smooth([[X + dir * 88, 118], [X + dir * 66, 142], [X + dir * 44, 118]], false, 1.6); p.line(X + dir * 88, 118, X + dir * 44, 118, 1.2); }
      p.fillDiamond(X, 84, 13, 15, 'gold'); p.diamond(X, 44, 10, undefined, 1.2); p.line(X - 40, 206, X + 40, 206, 2); p.hatch(X - 40, 208, 80, 22, 5, -.8, .7); },
    hanged(p) { p.line(22, 46, Wd - 22, 46, 2.2); p.line(22, 46, 22, 76, 1.6); p.line(Wd - 22, 46, Wd - 22, 76, 1.6); p.line(X, 46, X, 108, 1.4); p.poly([[X - 40, 108], [X + 40, 108], [X, 182]], 2, 'ink', 1.4);
      p.hatch(X - 26, 114, 52, 44, 6, 1.1, .6); p.dot(X, 196, 12); p.ring(X, 196, 20, 1.2, 'ink', 1.2, 20); p.diamond(X, 138, 12, undefined, 1.1); },
    death(p) { p.line(8, 148, Wd - 8, 148, 2.2); const arc = []; for (let k = 0; k <= 12; k++) { const a = Math.PI + k / 12 * Math.PI; arc.push([X + Math.cos(a) * 40, 148 + Math.sin(a) * 40]); } p.fillChord(arc, 'gold');
      p.rays(X, 148, 44, 62, 9, 1.2, Math.PI); for (let i = 0; i < 7; i++) { const x = 22 + i * 24; p.line(x, 152, x, 152 + 26 + (i % 3) * 8, 1.4); }
      p.smooth([[26, 96], [X, 58], [Wd - 26, 96]], false, 1.8); p.fillDiamond(X, 58, 8); p.hatch(8, 196, Wd - 16, 32, 7, -1.2, .6); },
    temperance(p) { p.poly([[X - 42, 52], [X + 42, 52], [X, 120]], 1.9, 'ink', 1.3); p.poly([[X - 42, 200], [X + 42, 200], [X, 132]], 1.9, 'ink', 1.3); p.fillPoly([[X - 15, 118], [X + 15, 118], [X + 15, 134], [X - 15, 134]], 'gold', .7);

// 5 · the Star writes itself, gold cooling to ink
function sceneStar(c, tau, i) {
  usePalette(CARD_STOCK); paper(c, PAL.sky, null, 9);

// 6 · the sky answers: the same places, and the stars come out in the day
const ANSWER = [['window', 1], ['pier', .75], ['boat', .75], ['hill', .5], ['crossroads', .5], ['lighthouse', .5]];
const ANSWER_STARS = [[0, .55], [.25, .8], [.5, .95], [.7, 1], [.85, 1], [.95, 1]];   // how far the stars have come out, at the start and end of each shot

// 7 · the name, over the first-light sky printed as the places are: each letter laid in gold that cools to ink;

    if (cool < 1) { c.globalAlpha = a; c.fillStyle = PAL.gold; c.fillText(word[k], at[k], base); }

// ===================== SHEETS (for review, ?sheets=1) =====================
function scenePlacesSheet(c, tau, i, stars = 0) {
  usePalette(FIRST_LIGHT); paper(c); const L = layer(); const g = L.getContext('2d');
  PLACE_ORDER.forEach((name, k) => { drawPlace(g, name, .6, { stars, look: stars }); const col = k % 4, row = Math.floor(k / 4); c.save(); resetT(c); c.drawImage(L, col * W / 4 + 4, row * H / 3 + 4, W / 4 - 8, H / 3 - 8); c.restore(); });
}
function sceneDeckSheet(c, tau, i) {
  usePalette(CARD_STOCK); paper(c);
  const cols = 6, s = Math.min(W / (cols * CARD_W * 1.12), H / (4 * CARD_H * 1.08));
  MAJORS.forEach((card, k) => { const col = k % cols, row = Math.floor(k / cols); c.save(); resetT(c); c.translate((col + .5) * W / cols - CARD_W * s / 2, 12 + row * CARD_H * s * 1.06); c.scale(s, s); cardFace(c, card, 1, k + 1); c.restore(); });
}

// ===================== SCORE =====================
// The app's own sounds (Sfx.swift), rebuilt for Web Audio: struck singing bowls that beat, chimes on the
// C-major pentatonic, a drone that breathes every ten seconds, the swell of the held question, card stock.
// Every cue is read off the timeline, so the sound lands on the cuts.
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
function renderBuf(ac, dur, f) { const sr = ac.sampleRate, n = Math.ceil(dur * sr), b = ac.createBuffer(2, n, sr), L = b.getChannelData(0), R = b.getChannelData(1); for (let i = 0; i < n; i++) { const [l, r] = f(i / sr); L[i] = l; R[i] = r; } return b; }
const Synth = {
  // a struck bowl: one pure partial and a few inharmonic ones, each split in two so it beats, the halves leaning to opposite ears
  bowl(ac, midi, dark = false) {
    const f0 = midiHz(midi), ratios = [1, 2.0, 2.71, 4.13, 5.40];
    const amps = dark ? [1, .10, .20, .05, .025] : [1, .12, .40, .15, .10], decays = dark ? [.40, 1.0, .9, 1.7, 2.3] : [.55, 1.4, 1.1, 2.1, 2.9], beats = dark ? [.6, 1.0, 1.7, 2.3, 2.9] : [1.0, 1.6, 2.3, 3.2, 3.9];
    const r = new AppRng(midi * 7 + (dark ? 3 : 1)), ph = ratios.map(() => r.next() * TAU), attack = dark ? .014 : .003;
    return renderBuf(ac, dark ? 6.5 : 5.5, t => { let l = 0, rr = 0; for (let k = 0; k < 5; k++) { const f = f0 * ratios[k]; if (f >= 14000) continue; const env = amps[k] * Math.exp(-t * decays[k]), a = Math.sin(TAU * (f - beats[k] / 2) * t + ph[k]), b = Math.sin(TAU * (f + beats[k] / 2) * t + ph[k] * 1.7); l += env * (a * .64 + b * .36); rr += env * (a * .36 + b * .64); } const s = (1 - Math.exp(-t / attack)) * .24; return [l * s, rr * s]; });
  },
  chime(ac, midi) { const f = midiHz(midi), tame = 1 / Math.max(1, Math.sqrt(f / 400)); return renderBuf(ac, 1.7, t => { const env = Math.exp(-t * 2.8) * (1 - Math.exp(-t / .0025)), v = Math.sin(TAU * f * t) + .16 * Math.sin(TAU * 2 * f * t) * Math.exp(-t * 3) + .06 * Math.sin(TAU * 2.76 * f * t) * Math.exp(-t * 7), s = v * env * .22 * tame; return [s, s]; }); },
  // C2 G2 C3 G3, breathing on a ten-second period, the right ear a hair sharp so it turns slowly
  drone(ac, dur) { const loop = 20, q = f => Math.round(f * loop) / loop, twin = 3 / loop, voices = [[q(midiHz(36)), .30], [q(midiHz(43)), .16], [q(midiHz(48)), .12], [q(midiHz(55)), .05]], harm = [1, .5, .28, .14];
    return renderBuf(ac, dur, t => { const breath = .5 - .5 * Math.cos(t * TAU / 10), sw = .72 + .28 * breath; let l = 0, r = 0; for (let vi = 0; vi < 4; vi++) { const [f, a] = voices[vi], s = vi === 0 ? 1 : sw; for (let h = 0; h < 4; h++) { const fh = f * (h + 1), g = a * harm[h] * s; l += g * Math.sin(TAU * fh * t); r += g * Math.sin(TAU * (fh + twin) * t); } } return [l * .36, r * .36]; }); },
  // the held question: an open chord rising out of wind, quickening
  swell(ac, hold) { const parts = [[midiHz(60), .30], [midiHz(67), .22], [midiHz(72), .18], [midiHz(76), .12], [midiHz(79), .10], [midiHz(84), .07]], nl = new AppRng(301), nr = new AppRng(302); let lpl = 0, lpr = 0;
    return renderBuf(ac, hold + .5, t => { const rise = t < hold ? Math.pow(t / hold, 2.2) : Math.exp(-(t - hold) * 7), trem = 1 + .22 * Math.sin(TAU * (3 + 4 * Math.min(t, hold) / hold) * t); let l = 0, r = 0; parts.forEach(([f, a], i) => { const d = .8 + i * .35; l += a * Math.sin(TAU * (f - d / 2) * t); r += a * Math.sin(TAU * (f + d / 2) * t); }); const cut = .015 + .10 * Math.min(t, hold) / hold; lpl += ((nl.next() * 2 - 1) - lpl) * cut; lpr += ((nr.next() * 2 - 1) - lpr) * cut; const e = rise * trem; return [(l * .34 + lpl * .5) * e * .5, (r * .34 + lpr * .5) * e * .5]; }); },
  noise(ac, dur, decay, cutoff, bite, seed = 77) { const r = new AppRng(seed); let lp = 0; return renderBuf(ac, dur, t => { const w = r.next() * 2 - 1; lp += (w - lp) * cutoff; const v = (lp * (1 - bite) + w * bite) * Math.exp(-t * decay) * (1 - Math.exp(-t / .002)) * .5; return [v, v]; }); },
  thud(ac) { const r = new AppRng(1031); let lp = 0; return renderBuf(ac, .26, t => { const w = r.next() * 2 - 1; lp += (w - lp) * .06; const v = (lp * Math.exp(-t * 18) * .7 + Math.sin(TAU * 92 * t) * Math.exp(-t * 26) * .35) * .8; return [v, v]; }); },
  riffle(ac) { const r = new AppRng(515), offs = []; let at = 0; for (let k = 0; k < 11; k++) { at += .028 + r.next() * .042; offs.push(at); } const n = new AppRng(909); let lp = 0; return renderBuf(ac, at + .2, t => { let env = 0; for (const o of offs) if (t >= o) env = Math.max(env, Math.exp(-(t - o) * 70)); const w = n.next() * 2 - 1; lp += (w - lp) * .4; const v = lp * env * .34; return [v, v]; }); },

function score(ac, t0, dest) {

  master.gain.setValueAtTime(.5, t0); master.gain.setValueAtTime(.5, t0 + DUR - 1.4); master.gain.linearRampToValueAtTime(0, t0 + DUR);

  const hand = ac.createGain(), small = reverbRoom(ac, .7, 7, 21, .6), hwet = ac.createGain(); hwet.gain.value = .25; hand.connect(small); small.connect(hwet); hwet.connect(master); hand.connect(master);

  G.setValueAtTime(0, t0 + star); G.linearRampToValueAtTime(.34, t0 + star + 1.4); G.setValueAtTime(.34, t0 + sign + .8); G.linearRampToValueAtTime(0, t0 + DUR); drone.start(t0);

  // the hold: the swell rises to the cut
  play(Synth.swell(ac, cut - gather), gather, 2.1);
  // the cut: the deck riffled, and a low, dark bowl under it
  play(Synth.riffle(ac), cut, 1.3, hand); play(bowl(48, true), cut, 1.2);
  // the riffle: card stock at every change, slowing; the back lands; the turn

  let acc = 0; RIFFLE_HOLD.forEach((h, k) => { play(tick, rs + acc / 12, .5 + (k % 3) * .12, hand, ((k * 37) % 7 - 3) / 10); acc += h; });

  for (const m of [60, 67, 76]) play(bowl(m), star + 2.6, .5);

// ===================== FILM =====================
// t (s)   dur    scene        look    what happens                                              sound
// 0.00    1.50   window       riso    a city at first light, one window lit; it rings           bowl C4, the drone rises
// 1.50    1.00   pier         riso    the end of a pier, a lamp, someone facing the sea         bowl E4
// 2.50    0.75   crossroads   riso    a signpost at a fork in the road                          bowl G4
// 3.25    0.75   door         riso    a doorway lit gold, someone on the step with a case       bowl A4
// 4.00    2.67   montage      riso    bench, clock, boat, hill, bridge, lighthouse, field,      a chime on each cut, rising,
//                                     ring: faster and faster                                   quickening
// 6.67    1.50   gather       paper   every place into the wheel's twelve houses; the wheel     the swell
//                                     turns and all of it goes into the light
// 8.17    0.08   flash        paper   the cut                                                   the riffle, a low bowl
// 8.25    2.58   riffle       ink     the deck riffles past, slows; the back; the turn          ticks slowing, a thud, a slide
// 10.83   3.00   star         ink     the Star writes itself in gold that cools to ink          the Star's bowl, then the chord
// 13.83   4.00   answer       riso    the places again; stars come out in the day sky           a chime for every star
// 17.83   3.50   signoff      riso    ARCANA laid letter by letter; the title's light passes     the long chord, the drone breathes out
const TIMELINE = [
  ...(new URLSearchParams(location.search).has('sheets') ? [
    { name: 'places', dur: .5, fn: (c, tau, i) => scenePlacesSheet(c, tau, i, 0) },
    { name: 'placesStars', dur: .5, fn: (c, tau, i) => scenePlacesSheet(c, tau, i, 1) },
    { name: 'deck', dur: .5, fn: sceneDeckSheet }] : []),
  // (the first shot is a hair short so every later cut lands on its own first drawn frame, not the frame before)
  ...MONTAGE.map(([name, dur], k) => ({ name, dur: k ? dur : dur - 1e-9, fn: placeScene(name, k) })),
  { name: 'gather', dur: 1.5, fn: sceneGather },
  { name: 'flash', dur: 1 / 12, fn: sceneFlash },
  { name: 'riffle', dur: (RIFFLE_FRAMES + BACK_FRAMES + FLIP_FRAMES) / 12, fn: sceneRiffle },
  { name: 'star', dur: 3, fn: sceneStar },
  ...ANSWER.map(([name, dur], k) => ({ name: 'answer-' + name, dur, fn: answerScene(name, k) })),
  { name: 'signoff', dur: 3.5, fn: sceneSignoff },
];
defineFilm({ timeline: TIMELINE, score, format: { ar: '1:1' } });
</script>
